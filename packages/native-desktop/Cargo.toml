[package]
name = "native-desktop"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "AI 助手桌面原语：截屏 + 键鼠注入（napi-rs，Windows 先行）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4", "napi6"] }
napi-derive = "3"
image = "0.25"
xcap = "=0.4.1"
enigo = "0.6"

# Windows 下 DPI 感知 / 焦点配方 / UIA
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
# UIA（自带 windows 0.62，与上面 0.61 共存，类型互不混用）
uiautomation = "0.25"

[build-dependencies]
napi-build = "2"
