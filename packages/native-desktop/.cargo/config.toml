# 发布卫生：抹掉二进制产物中嵌入的构建机用户路径
#
# 背景：rustc 默认把编译期源码路径（含 C:\Users\<用户名>\...）硬编码进
# panic 位置字符串。发布到 npm 的 .node 二进制会因此携带构建机用户名。
# remap-path-prefix 只改写 panic 消息里显示的路径前缀，
# 不影响任何功能、性能与调试信息中的 crate 名/版本/行号。
#
# 说明：此路径是本机构建机的用户目录；在其他机器上不匹配即无任何作用，
# 属于安全的机器本地配置。如换机构建，改成对应路径即可。
[target.'cfg(all())']
rustflags = [
    '--remap-path-prefix=C:\Users\udumb=/build',
]
